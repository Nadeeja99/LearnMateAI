services:
  # Backend API Service
  - type: web
    name: learnmate-backend
    env: python
    # NOTE: Render only attaches persistent disks to paid instance types. On the free plan
    # the `disk` below is not available, so uploaded documents, conversations and analytics
    # are lost on every deploy, restart, or idle spin-down. Use a paid plan (e.g. starter)
    # or move storage off-box before relying on persistence.
    plan: free
    # requirements.lock pins every transitive package (regenerate with scripts/lock-requirements.sh)
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.lock
    # Render routes traffic only to instances whose /health responds, and restarts unhealthy ones
    healthCheckPath: /health
    # --proxy-headers: take the client IP from Render's proxy (X-Forwarded-For) for per-IP rate limits
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      - key: LANGFUSE_ENABLED
        value: true
      - key: PYTHON_VERSION
        value: 3.11.0
      # Sessions untouched for this many days are deleted on startup (0 disables cleanup)
      - key: SESSION_TTL_DAYS
        value: 30
      # One JSON object per log line, each tagged with its request id
      - key: LOG_FORMAT
        value: json
      # Comma-separated frontend origins allowed to call the API
      - key: CORS_ORIGINS
        value: https://learnmate-frontend.onrender.com
    disk:
      name: backend-storage
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

  # Frontend Service
  - type: web
    name: learnmate-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      # SPA: serve index.html for client-side routes (the app calls the API directly via VITE_API_URL)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://learnmate-backend-koe5.onrender.com
    # Security headers. The CSP is the main guard for the session id kept in localStorage:
    # only the app's own bundled scripts can run - no inline or third-party scripts.
    # (next-themes renders an inline <script>, but React-inserted scripts never execute, so it
    # needs no allowance; the theme is applied from React instead. frontend/e2e/security.spec.ts
    # checks this policy against every feature.)
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://learnmate-backend-koe5.onrender.com wss://learnmate-backend-koe5.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), geolocation=(), microphone=(self)"
