services:
  # Backend API Service
  - type: web
    name: learnmate-backend
    env: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
      - key: LANGFUSE_ENABLED
        value: true
      - key: PYTHON_VERSION
        value: 3.11.0
    disk:
      name: backend-storage
      mountPath: /opt/render/project/src/backend/data
      sizeGB: 1

  # Frontend Service
  - type: web
    name: learnmate-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://learnmate-backend-koe5.onrender.com/$1
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://learnmate-backend-koe5.onrender.com
