# Quality gates for every push and pull request.
# backend + frontend run in parallel; e2e runs the full Playwright suite once both pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest, pyflakes, lock check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # same as Render (PYTHON_VERSION) and the Dockerfile
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install (exact locked versions + test tools)
        run: pip install -r requirements-dev.txt
      - name: Lint (pyflakes)
        run: python -m pyflakes app tests
      - name: Tests
        run: python -m pytest -q
      - name: requirements.lock contains every requirements.txt pin
        working-directory: .
        run: python scripts/check-lock.py

  frontend:
    name: Frontend (lint, typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings=0
      - name: Typecheck (app, tooling, e2e)
        run: npx tsc -p tsconfig.app.json --noEmit && npx tsc -p tsconfig.node.json --noEmit && npx tsc -p tsconfig.e2e.json
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Playwright, production CSP)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: pip install -r backend/requirements.lock
      - name: Install frontend + Chromium
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: frontend
        env:
          CI: "true"
          E2E_PYTHON: python
        run: npm run e2e
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
